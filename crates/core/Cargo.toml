[package]
name = "manyproxy-core"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
base64 = "0.22"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
getrandom = "0.4"
zeroize = "1.9"
regex = "1"
interprocess = "2.4"

[features]
test-support = []
