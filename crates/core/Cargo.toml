[package]
name = "manyproxy-core"
version = "0.0.1"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
getrandom = "0.4"
zeroize = "1.9"
regex = "1"
interprocess = "2.4"

[features]
test-support = []
