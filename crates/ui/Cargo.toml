[package]
name = "manyproxy-ui"
version = "0.0.1"
edition = "2021"

[dependencies]
manyproxy-core = { path = "../core" }
gpui-kit = "0.6"
tray-icon = "0.25"
winreg = "0.55"
raw-window-handle = "0.6"
qrcodegen = "1.8.0"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
futures = "0.3"

[dev-dependencies]
manyproxy-core = { path = "../core", features = ["test-support"] }
gpui-kit = { version = "0.6", features = ["test-support"] }
base64 = "0.22"

[build-dependencies]
png = "0.18"
