[package]
name = "manyproxy-ui"
version = "0.0.2"
edition = "2021"

[dependencies]
manyproxy-core = { path = "../core" }
gpui-kit = "0.6"
tray-icon = "0.25"
winreg = "0.55"
raw-window-handle = "0.6"
qrcodegen = "1.8.0"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
futures = "0.3"
web-time = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
manyproxy-core = { path = "../core", features = ["test-support"] }
gpui-kit = { version = "0.6", features = ["test-support"] }
base64 = "0.22"

[build-dependencies]
png = "0.18"
