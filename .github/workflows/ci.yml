name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push on the same branch or PR supersedes this run; no reason to
# keep paying for a runner that can only produce a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-specific cargo settings. Incremental state bloats the rust-cache and
  # costs more to maintain than a clean rebuild on a fresh runner; debug
  # info is never read here, and Windows PDBs for ~1,500 tests dominate
  # link time. Neither changes debug_assertions or test behaviour.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# Windows only: the app links winreg/tray-icon and build.rs embeds Windows
# resources. A Linux runner would need the full GPUI system dependency set
# (x11/wayland/vulkan) before it could compile anything, so the matrix stays
# cheap instead of pretending to cover it.
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Doc paths
        shell: pwsh
        run: |
          $missing = Select-String -Path AGENTS.md,README.md -Pattern '`([^`]+\.md)`' -AllMatches |
            ForEach-Object { $_.Matches.Groups[1].Value } |
            Sort-Object -Unique |
            Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing doc paths: $missing"; exit 1 }
      # DESIGN.md promises app code carries no color literals: every surface,
      # rim and state color reads a gpui-kit theme token. dialog/qr.rs is the
      # documented exception (a scanner needs real black on real white).
      - name: Color literals
        shell: pwsh
        run: |
          $pattern = '#[0-9A-Fa-f]{6}\b|\b0x[0-9A-Fa-f]{6}\b|\b0x[0-9A-Fa-f]{8}\b'
          # skin.rs is the theme: DESIGN.md names it the only file that may
          # stamp palette values. dialog/qr.rs is the documented scanner
          # exception (real black on real white).
          $hits = Get-ChildItem crates/ui/src,src -Recurse -Filter *.rs |
            Where-Object { $_.Name -ne 'tests.rs' -and ($_.FullName -replace '\\', '/') -notmatch '/crates/ui/src/(dialog/qr|skin)\.rs$' } |
            Select-String -Pattern $pattern
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error 'Color literals belong in the theme; use a gpui-kit token.'
            exit 1
          }
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
