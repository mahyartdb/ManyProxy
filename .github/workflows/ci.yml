name: CI

on:
  push:
    branches: [master, ui-audit-fixes]
  pull_request:
    branches: [master]

# Windows only: the app links winreg/tray-icon and build.rs embeds Windows
# resources. A Linux runner would need the full GPUI system dependency set
# (x11/wayland/vulkan) before it could compile anything, so the matrix stays
# cheap instead of pretending to cover it.
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
