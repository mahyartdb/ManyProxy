
name: live

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "Pinned sing-box version (generator target)"
        required: true
        default: "1.14.2"

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  live-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch pinned sing-box (no silent downloads in the app itself)
        shell: pwsh
        env:
          SINGBOX_VERSION: ${{ inputs.singbox_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:SINGBOX_VERSION
          $zip = "sing-box-$version-windows-amd64.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/$zip"
          $dir = "$env:RUNNER_TEMP\sing-box-$version-windows-amd64"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$zip"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found under $dir after extracting $zip" }
          New-Item -ItemType Directory -Path "target\debug" -Force | Out-Null
          Copy-Item $exe.FullName -Destination "target\debug\sing-box.exe" -Force
          $reported = (& "target\debug\sing-box.exe" version | Out-String).Trim()
          Write-Host $reported
          if ($LASTEXITCODE -ne 0 -or $reported -notlike "*$version*") { throw "target\debug\sing-box.exe reports '$reported' (exit $LASTEXITCODE), expected the pinned $version" }

      - name: Live proofs (gated; hermetic suite runs first un-gated)
        shell: pwsh
        env:
          MANYPROXY_LIVE_CHECK: "1"
          MANYPROXY_LIVE_TRAFFIC: "1"
          MANYPROXY_SINGBOX_BIN: "target\\debug\\sing-box.exe"
        run: |
          cargo test --locked
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Gated proof family (pinned sing-box): t32 standard rows, t37 preset rules, t58 Throne-country-style route profile — all sing-box check green."
