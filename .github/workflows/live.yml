
name: live

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "Pinned sing-box version (generator target)"
        required: true
        default: "1.14.2"

env:
  SINGBOX_VERSION: ${{ inputs.singbox_version }}

jobs:
  live-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch pinned sing-box (no silent downloads in the app itself)
        shell: pwsh
        run: |
          $version = "${{ inputs.singbox_version }}"
          $zip = "sing-box-$version-windows-amd64.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/$zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$zip"
          $dir = "$env:RUNNER_TEMP\sing-box-$version-windows-amd64"
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath "$env:RUNNER_TEMP"
          Copy-Item "$dir\sing-box.exe" -Destination "target\debug\sing-box.exe" -Force
          & "target\debug\sing-box.exe" version

      - name: Live proofs (gated; hermetic suite runs first un-gated)
        shell: pwsh
        env:
          MANYPROXY_LIVE_CHECK: "1"
          MANYPROXY_LIVE_TRAFFIC: "1"
          MANYPROXY_SINGBOX_BIN: "target\\debug\\sing-box.exe"
        run: |
          cargo test --locked
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Gated proof family (pinned sing-box): t32 standard rows, t37 preset rules, t58 Throne-country-style route profile — all sing-box check green."
