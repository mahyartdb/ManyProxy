[package]
name = "manyproxy"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["crates/core", "crates/ui"]
default-members = [".", "crates/core", "crates/ui"]

[dependencies]
manyproxy-core = { path = "crates/core" }
manyproxy-ui = { path = "crates/ui" }

[build-dependencies]
embed-resource = "3"
