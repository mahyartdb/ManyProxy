[package]
name = "manyproxy"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
serde_json = "1"
futures = "0.3"
tray-icon = "0.25"
winreg = "0.55"
raw-window-handle = "0.6"
# Ticket 41 (spec-approved, research-first): 128-bit clash secrets.
getrandom = "0.4"
zeroize = "1.9"
# Ticket 05 (throne-adoption): logs-pane regex filtering. Already a
# transitive dep in Cargo.lock (offline-safe: served from the local cache).
regex = "1"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }

[build-dependencies]
embed-resource = "3"
png = "0.18"
